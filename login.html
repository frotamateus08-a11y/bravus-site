
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo | BRAVUS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #171717;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #101010;
            padding: 22px 8%;
            border-bottom: 1px solid #333;
            text-align: center;
        }

        .logo {
            color: #d4af37;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 5px;
            text-decoration: none;
        }

        .subtitulo {
            color: #aaa;
            font-size: 12px;
            letter-spacing: 2px;
            margin-top: 8px;
            text-transform: uppercase;
        }

        nav {
            background-color: #202020;
            padding: 14px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 22px;
            border-bottom: 1px solid #383838;
        }

        nav a {
            color: #f5f5f5;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover,
        nav a:focus {
            color: #d4af37;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background-color: #222;
            padding: 35px;
            border: 1px solid #383838;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .descricao {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #494949;
            border-radius: 4px;
            background-color: #171717;
            color: #fff;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #d4af37;
            border-color: #d4af37;
        }

        .botao-entrar {
            width: 100%;
            padding: 14px;
            background-color: #d4af37;
            color: #171717;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .botao-entrar:hover {
            background-color: #f0cf62;
        }

        .mensagem {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 4px;
            background-color: #332d19;
            color: #f0cf62;
            font-size: 13px;
            line-height: 1.5;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #d4af37;
            text-decoration: none;
            font-size: 14px;
        }

        .voltar:hover {
            text-decoration: underline;
        }

        footer {
            background-color: #101010;
            border-top: 1px solid #333;
            padding: 20px;
            text-align: center;
            color: #999;
            font-size: 13px;
            line-height: 1.8;
        }

        footer a {
            color: #d4af37;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
            }

            .logo {
                font-size: 27px;
            }

            nav {
                gap: 14px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="logo">BRAVUS</a>
        <p class="subtitulo">Área administrativa</p>
    </header>

    <nav aria-label="Menu da administração">
        <a href="index.html">Página inicial</a>
        <a href="login.html">Login</a>
        <a href="objetos.html">Cadastro de objetos</a>
        <a href="usuarios.html">Cadastro de usuários</a>
    </nav>

    <main>
        <section class="login-container">
            <h1>Entrar</h1>

            <p class="descricao">
                Acesse a área administrativa para gerenciar
                os objetos tema e os usuários do site.
            </p>

            <form id="form-login">
                <div class="campo">
                    <label for="usuario">Usuário</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="botao-entrar">
                    Entrar na administração
                </button>

                <p id="mensagem" class="mensagem" role="status"></p>
            </form>

            <a href="index.html" class="voltar">
                &larr; Voltar para a loja
            </a>
        </section>
    </main>

    <footer>
        <p>Autor: Matt Frota</p>
        <p><a href="autor.html">Sobre o autor</a></p>
        <p>&copy; 2026 BRAVUS — Joias masculinas.</p>
    </footer>

    <script>
        const formulario = document.getElementById("form-login");
        const mensagem = document.getElementById("mensagem");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            mensagem.textContent =
                "A interface de login está funcionando. " +
                "A autenticação real precisa ser implementada.";
            mensagem.style.display = "block";
        });
    </script>

</body>
</html>
