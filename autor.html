    <style>
        .menu-admin {
            position: relative;
            display: inline-block;
        }

        .menu-admin > a {
            text-decoration: none;
        }

        .submenu-admin {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 190px;
            background: #1b1b1b;
            border: 1px solid #c9a227;
            z-index: 1000;
        }

        .submenu-admin a {
            display: block;
            padding: 10px 14px;
            color: inherit;
            text-decoration: none;
            white-space: nowrap;
        }

        .submenu-admin a:hover,
        .submenu-admin a:focus {
            background: #333;
        }

        .menu-admin:hover .submenu-admin,
        .menu-admin:focus-within .submenu-admin {
            display: block;
        }
    </style>
</head>
